<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기업 혜택 찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 레이아웃: 왼쪽 고정 입력 패널 + 오른쪽 결과 목록. 공문서 느낌의 세리프 제목, 데이터는 모노스페이스. */
  :root {
    --bg: #F4F7F5;
    --surface: #FFFFFF;
    --ink: #15231F;
    --muted: #5F6E69;
    --line: #D5DDD9;
    --accent: #0E6B52;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2F0EA;
    --warn: #8A5200;
    --warn-soft: #FBEFD9;
    --soon: #A3321E;
    --soon-soft: #FBE4DE;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-display: "Noto Serif KR", "Apple Myungjo", "Batang", serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1714; --surface: #172220; --ink: #E7EEEB; --muted: #9DACA6; --line: #2B3935;
      --accent: #4FC49B; --accent-ink: #0B1A14; --accent-soft: #173529;
      --warn: #E6B35B; --warn-soft: #3A2D13; --soon: #F39A82; --soon-soft: #3F2219;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1714; --surface: #172220; --ink: #E7EEEB; --muted: #9DACA6; --line: #2B3935;
    --accent: #4FC49B; --accent-ink: #0B1A14; --accent-soft: #173529;
    --warn: #E6B35B; --warn-soft: #3A2D13; --soon: #F39A82; --soon-soft: #3F2219;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 48px;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { max-width: 1120px; margin: 0 auto; padding-block: 28px 20px; border-bottom: 1px solid var(--line); }
  .top h1 { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
  .top p { margin: 0; color: var(--muted); max-width: 62ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 0.82rem; color: var(--muted); font-family: var(--font-mono); }

  .wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; padding-top: 24px; align-items: start; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; position: sticky; top: env(safe-area-inset-top, 0px); }
  @media (max-width: 820px) { .panel { position: static; } }
  .panel h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; font-weight: 500; }
  .field { display: grid; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 0.86rem; font-weight: 500; }
  .field .hint { font-size: 0.78rem; color: var(--muted); }
  .field input, .field select {
    width: 100%; font: inherit; font-size: 0.93rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); min-width: 0;
  }
  .field input[type="number"], .field input.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .unit { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .unit span { font-size: 0.82rem; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; flex: 1; }
  button.primary:hover { filter: brightness(1.05); }

  .results-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; margin-bottom: 14px; }
  .results-head h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; }
  .results-head .count { color: var(--muted); font-size: 0.9rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; }

  .list { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
  .card--review { border-style: dashed; }
  .card__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; margin-bottom: 8px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-family: var(--font-mono); font-size: 0.74rem; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .badge--soon { background: var(--soon-soft); color: var(--soon); }
  .badge--upcoming { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .badge--always { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .badge--review { background: var(--warn-soft); color: var(--warn); }
  .source { font-size: 0.78rem; color: var(--muted); }
  .card__title { font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; margin: 0 0 12px; line-height: 1.4; text-wrap: balance; }
  .detail { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 0.92rem; }
  .detail dt { color: var(--muted); font-size: 0.82rem; padding-top: 2px; }
  .detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .review-note { margin: 12px 0 0; padding: 10px 12px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; font-size: 0.86rem; }
  .card__foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 0.86rem; }
  .muted { color: var(--muted); font-family: var(--font-mono); font-size: 0.78rem; }
  .empty { color: var(--muted); padding: 28px 0; font-size: 0.95rem; }
  .empty strong { color: var(--ink); }

  @media (prefers-reduced-motion: no-preference) { button { transition: filter .15s ease; } }
</style>

</head>
<body>
<header class="top">
  <h1>기업 혜택 찾기</h1>
  <p>사업자 정보를 입력하면 정부와 지자체가 제공하는 세제혜택, 지원금, 보조금, 융자 중 조건이 맞는 것만 골라 보여줍니다.</p>
  <div class="meta">
    <span>조회일 <span id="today"></span></span>
    <span id="data-note"></span>
  </div>
</header>

<div class="wrap">
  <aside class="panel">
    <h2>입력 정보</h2>
    <form id="form" novalidate>
      <div class="field">
        <label for="entity">사업자 유형</label>
        <select id="entity">
          <option value="개인">개인사업자</option>
          <option value="법인">법인사업자</option>
          <option value="예비창업자">예비창업자 (사업자등록 전)</option>
        </select>
      </div>
      <div class="field" id="age-field">
        <label for="age">업력</label>
        <select id="age">
          <option value="1년 미만">1년 미만</option>
          <option value="1~3년">1년 이상 3년 미만</option>
          <option value="3~7년">3년 이상 7년 미만</option>
          <option value="7년 이상">7년 이상</option>
        </select>
      </div>
      <div class="field">
        <label for="ksic">업종 (표준산업분류 중분류)</label>
        <select id="ksic"></select>
      </div>
      <div class="field">
        <label for="ksic_full">세부 업종 코드 <span class="hint">(알면 입력, 5자리)</span></label>
        <input id="ksic_full" class="mono" inputmode="numeric" maxlength="5" placeholder="예: 56111">
      </div>
      <div class="row2">
        <div class="field">
          <label for="revenue">연매출</label>
          <div class="unit"><input id="revenue" type="number" min="0" step="1" placeholder="0"><span>만원</span></div>
        </div>
        <div class="field">
          <label for="employees">상시근로자</label>
          <div class="unit"><input id="employees" type="number" min="0" step="1" placeholder="0"><span>명</span></div>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="region">소재지 시/도</label>
          <select id="region"></select>
        </div>
        <div class="field">
          <label for="district">시/군/구</label>
          <input id="district" placeholder="예: 성남시">
        </div>
      </div>
      <div class="field" id="tax-field">
        <label for="tax">국세·지방세 체납</label>
        <select id="tax">
          <option value="no">체납 없음</option>
          <option value="yes">체납 있음</option>
        </select>
        <span class="hint">체납자를 제외하는 공고는 결과에서 빠집니다.</span>
      </div>
      <div class="actions">
        <button type="submit" class="primary">혜택 찾기</button>
        <button type="button" id="reset">초기화</button>
      </div>
    </form>
  </aside>

  <section>
    <div class="results-head" id="results-head" hidden>
      <h2>검색 결과</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="legend">
      <span>실선 카드: 입력 조건과 모두 일치</span>
      <span>점선 카드: 공고 원문에서 확인이 필요한 조건이 있음</span>
    </div>
    <div class="list" id="results"></div>
    <p class="empty" id="empty" hidden><strong>조건에 맞는 혜택이 없습니다.</strong> 입력값을 바꾸거나 공고 데이터가 갱신된 뒤 다시 조회하세요.</p>
  </section>
</div>

<script src="data/benefits.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
